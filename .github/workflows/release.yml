name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Python 版的打包在 .goreleaser.yaml 的 before hooks 里完成，这里只需 python3。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python script
        run: python -m py_compile pixiv_recover.py

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
